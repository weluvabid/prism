[package]
name = "prism"
version = "0.1.0"
description = "Turn supplied terminal text into polished, shareable PNGs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.20"
tiny-skia = "0.12"
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[lints]
workspace = true
